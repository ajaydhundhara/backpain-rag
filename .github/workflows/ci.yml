name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]' ruff
      - name: Lint
        run: ruff check src tests tools --select F,E9,B --ignore B008,B904
      - name: Test (offline -- the LLM is faked)
        run: pytest -q
